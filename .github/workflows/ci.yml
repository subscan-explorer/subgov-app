name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: node --version
      - run: corepack enable
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit
      - run: pnpm build

  image:
    name: Runtime image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: subgov:ci
          cache-from: type=gha,scope=subgov-pr
          cache-to: type=gha,mode=max,scope=subgov-pr
      - name: Verify runtime and HTTP startup
        run: |
          test "$(docker run --rm --entrypoint node subgov:ci --version)" = v24.22.1
          test "$(docker run --rm --entrypoint pnpm subgov:ci --version)" = 11.24.0
          container=$(docker run -d -p 127.0.0.1::3015 subgov:ci)
          trap 'docker rm -f "$container" >/dev/null' EXIT
          address=$(docker port "$container" 3015/tcp)
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 5 "http://$address/settings/?chain=polkadot" -o "$RUNNER_TEMP/subgov-settings.html"; then
              if grep -Fq 'Profile preferences' "$RUNNER_TEMP/subgov-settings.html"; then
                exit 0
              fi
            fi
            sleep 1
          done
          docker logs "$container"
          echo "SubGov did not return a successful HTTP response" >&2
          exit 1

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete reachable Git history
        run: >-
          "$RUNNER_TEMP/gitleaks" git .
          --log-opts="--all --full-history"
          --redact=100 --no-banner --ignore-gitleaks-allow
