name: Release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.repository == 'subscan-explorer/subgov-app' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: github.ref == 'refs/heads/main'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=git-
            type=sha
            type=sha,suffix=-${{ github.run_number }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          build-args: |
            NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${{ vars.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote the main image to the release tag
        if: github.ref_type == 'tag'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          source="$IMAGE:git-$(git rev-parse HEAD)"
          # A tag pushed with main may arrive before its image is built.
          for attempt in {1..40}; do
            if docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
              docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$GITHUB_REF_NAME" "$source"
              exit 0
            fi
            sleep 15
          done
          echo "::error::No published main image for $(git rev-parse HEAD). Check the main Release run, then retry this tag."
          exit 1
